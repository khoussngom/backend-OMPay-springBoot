# Test properties to ensure external service credentials are available during tests
# Prefer environment values if present, otherwise use safe defaults for unit tests.

# Cloudinary (used by CloudinaryService @Value)
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:dbfhej7xk}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:873141682942693}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:placeholder}

# Twilio (used by SmsServiceImpl / OtpService)
TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:testSid}
TWILIO_TOKEN=${TWILIO_TOKEN:testToken}
# Provide a direct default phone number for tests (avoid using shell-style ${VAR:+val} syntax)
