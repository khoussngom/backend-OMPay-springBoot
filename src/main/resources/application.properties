spring.application.name=UsersMicroservice
spring.datasource.url=${NEON_DATABASE_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
server.port=${PORT:8086}
springdoc.api-docs.path=/v3/api-docs
spring.main.allow-circular-references=true
spring.jpa.open-in-view=false

# SECRET_KEY and EXPIRATION_TIME are defined in JwtUtil with defaults
# Twilio credentials must be provided via environment variables; do NOT commit secrets.
TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:}
TWILIO_MESSAGING_SID=${TWILIO_MESSAGING_SID:}
TWILIO_TOKEN=${TWILIO_TOKEN:}
TWILIO_FROM=${TWILIO_FROM:}

# Cloudinary credentials must be provided via environment variables; do NOT commit secrets.
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:}
