spring.application.name=UsersMicroservice
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
server.port=${PORT:8086}
springdoc.api-docs.path=/v3/api-docs
spring.main.allow-circular-references=true

SECRET_KEY=${SECRET_KEY}
EXPIRATION_TIME=${EXPIRATION_TIME}
TWILIO_ACCOUNT_SID=<REDACTED_TWILIO_ACCOUNT_SID>
TWILIO_MESSAGING_SID=<REDACTED_TWILIO_MESSAGING_SID>
TWILIO_TOKEN=<REDACTED_TWILIO_TOKEN>
TWILIO_FROM=<REDACTED_TWILIO_FROM>
